name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec prettier --check .
            - run: pnpm run lint
            - run: pnpm test
            - run: pnpm run pack:check
