name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm and Node.js
        uses: ./.github/actions/setup-pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm exec oxfmt --check
      - name: Run lint
        run: pnpm run lint
      - name: Run tests
        run: pnpm test
      - name: Check package
        run: pnpm run pack:check
