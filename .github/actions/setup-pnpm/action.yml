name: Set up pnpm and Node.js
description: Install pnpm and set up Node.js from package.json with pnpm dependency caching.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: "package.json"
        cache: "pnpm"
